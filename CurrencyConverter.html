<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Converter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
     <style>
    /*Mise en forme du body*/
     :root {
    --bg: #0F1D2B;
    --panel: #16283A;
    --panel-border: #24405A;
    --gold: #C9A227;
    --gold-soft: rgba(201, 162, 39, 0.15);
    --text: #F3EFE3;
    --text-muted: #8FA3B8;
    --success: #4C9174;
    --error: #C4694A;
  }
  body{
            margin: 0;
            padding: 0;
            min-height: 100vh;
            width: 100%; 
            display: flex;
            flex-direction: column;
            background-color: rgb(239, 241, 241);
            justify-content: center; 
            align-items: center;     
            font-family: Arial, sans-serif;
        }
        /*carte du convertisseur*/
         .carte {
    width: 100%;
    max-width: 440px;
    background: #030a2e;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    padding: 36px 32px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
  }

   h1 {
    font-family: 'Fraunces', serif;
    font-size: 28px;
    font-weight: 600;
    margin: 0 0 28px;
    color: var(--text);
  }
        /*Mise en forme du cadre du convertisseur*/
        .ligne-devises{
            color: gold;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items:end ;
            gap:10px ;
            margin-bottom: 24px;
        }
        /**/
        select{
            width: 100%;
            background: var(--bg);
            padding: 12px 8px;
            border-radius: 10px;
            border: 1px solid var(--panel-border);
            font-family: 'inter',sans-serif;
            font-size: 13px;
            color:var(--text) ;
            cursor: pointer;
        }

         #bouton-inverser {
    background: var(--gold-soft);
    border: 1px solid var(--gold);
    color: var(--gold);
    width: 38px;
    height: 38px;
    border-radius: 50%;
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    transition: transform 0.2s ease;
  }

  #bouton-inverser:hover { transform: rotate(180deg); }

  .bouton-principal {
    width: 100%;
    background: var(--gold);
    color: #16283A;
    border: none;
    border-radius: 10px;
    padding: 15px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    cursor: pointer;
    transition: filter 0.15s ease;
  }

  .bouton-principal:hover { filter: brightness(1.1); }
  .bouton-principal:disabled { opacity: 0.6; cursor: wait; }

  .zone-resultat { margin-top: 4px; min-height: 20px; }

  .ligne-calcul {
    font-size: 13px;
    color: var(--text-muted);
    margin: 0 0 4px;
    border-top: 1px dashed var(--panel-border);
    padding-top: 20px;
  }

  .montant-resultat {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 32px;
    font-weight: 600;
    color: var(--success);
    margin: 0 0 8px;
    font-variant-numeric: tabular-nums;
  }

  .detail-taux { font-size: 12px; color: var(--text-muted); margin: 0; }

  .erreur, .chargement {
    font-size: 14px;
    border-top: 1px dashed var(--panel-border);
    padding-top: 20px;
    margin: 0;
  }
  .erreur { color: var(--error); }
  .chargement { color: var(--text-muted); }

  .credit {
    margin-top: 24px;
    font-size: 11px;
    color: var(--text-muted);
    text-align: center;
    opacity: 0.7;
  }

  @media (prefers-reduced-motion: reduce) {
    #bouton-inverser { transition: none; }
    #bouton-inverser:hover { transform: none; }
  }

  @media (max-width: 480px) {
    .carte { padding: 28px 22px; }
    h1 { font-size: 24px; }
  }
        label{
            display: block;
            font-size: 12px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

   .carte h2 {
    color: gold;
      text-align: center;
      margin-bottom: 20px;
    }
    .carte input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
   .carte button {
      width: 100%;
      padding: 10px;
      background: #eaf370;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .carte button:hover {
      background: gold;
    }

</style>
</head>
<body>
    <header><h3>Convertisseur de devises</h3></header>
    <p>Connaisser la valeur de chaque devise dans le monde</p>
    <main class="carte">
    
<h2><p style="text-align: center;">Converter</p></h2>
<!--corps du convertisseur-->
<label for="montant">Montant</label>
<input type="number" id="montant" inputmode="decimal" min="0" step="any" placeholder="Entrez le montant" required>
<!---->
<div class="ligne-devises">
<div>
<label for="devise-de">De</label>
<select id="devise-de"></select>
</div>
<!---->
<button id="bouton-inverser" type="button" aria-label="Inverser les deux
devises">↔</button>
<!---->
<div>
<label for="devise-vers">Vers</label>
<select id="devise-vers"></select>
</div>
</div>
<button  id="bouton-convertir" class="bouton-principal" type="button">Lancer la conversion</button>

  </div>  
  <div id="resultat" class="zone-resultat" aria-live="polite"></div>
  <p class="credit">Données fournies par l'API gratuite Frankfurter (api.frankfurter.dev)</p>
</main>
<script>
//les devises
const DEVISES = {
  XAF: "Franc CFA (Afrique Centrale)",
  XOF: "Franc CFA (Afrique de l'Ouest)",
  EUR: "Euro",
  USD: "Dollar américain",
  GBP: "Livre sterling",
  MXN: "Peso mexicain"
};
//Remplissage des deux menus déroulants
function remplirListesDevises() {
  const selectDe = document.getElementById('devise-de');
  const selectVers = document.getElementById('devise-vers');
  for (const [code, nom] of Object.entries(DEVISES)) {
    selectDe.add(new Option(`${code} — ${nom}`, code));
    selectVers.add(new Option(`${code} — ${nom}`, code));
  }
  selectDe.value = "XAF";
  selectVers.value = "EUR";
}
//Inversion des deux devises
function inverserDevises() {
  const selectDe = document.getElementById('devise-de');
  const selectVers = document.getElementById('devise-vers');
  const temp = selectDe.value;
  selectDe.value = selectVers.value;
  selectVers.value = temp;
}
//Conversion
async function convertir() {
  const montantInput = document.getElementById('montant');
  const montant = parseFloat(montantInput.value);
  const de = document.getElementById('devise-de').value;
  const vers = document.getElementById('devise-vers').value;
  const zoneResultat = document.getElementById('resultat');
  const bouton = document.getElementById('bouton-convertir');

  if (isNaN(montant) || montant <= 0) {
    zoneResultat.innerHTML = `<p class="erreur">Entrez un montant valide (supérieur à 0).</p>`;
    return;
  }
  if (de === vers) {
    zoneResultat.innerHTML = `<p class="erreur">Choisissez deux devises différentes.</p>`;
    return;
  }

  bouton.disabled = true;
  bouton.textContent = "Conversion...";
  zoneResultat.innerHTML = `<p class="chargement">Récupération du taux en direct...</p>`;

  try {
    const url = `https://api.frankfurter.dev/v2/rate/${de}/${vers}`;
    const reponse = await fetch(url);
    if (!reponse.ok) {
      throw new Error(`Erreur HTTP ${reponse.status}`);
    }
    const donnees = await reponse.json();
    const taux = donnees.rate;
    const resultat = (montant * taux).toFixed(2);
    zoneResultat.innerHTML = `
      <p class="ligne-calcul">${montant.toLocaleString('fr-FR')} ${de} =</p>
      <p class="montant-resultat">${Number(resultat).toLocaleString('fr-FR', {minimumFractionDigits: 2})} ${vers}</p>
      <p class="detail-taux">1 ${de} = ${taux} ${vers} · taux du ${donnees.date}</p>
    `;
  } catch (erreur) {
    zoneResultat.innerHTML = `<p class="erreur">Impossible de récupérer le taux. Vérifiez votre connexion internet et réessayez.</p>`;
    console.error(erreur);
  } finally {
    bouton.disabled = false;
    bouton.textContent = "Lancer la conversion";
  }
}
document.addEventListener('DOMContentLoaded', () => {
  remplirListesDevises();
  document.getElementById('bouton-convertir').addEventListener('click', convertir);
  document.getElementById('bouton-inverser').addEventListener('click', inverserDevises);
  document.getElementById('montant').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') convertir();
  });
});

</script>
</body>
</html>
